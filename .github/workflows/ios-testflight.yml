name: iOS TestFlight Build

# Builds the Capacitor iOS wrapper (Mobile/ios-wrapper) on a macOS runner,
# signs it, and uploads it to TestFlight.
#
# Trigger manually from the Actions tab. A push to main that changes
# tools/appstore/what-to-test.txt alone posts those notes on the latest build
# and does not upload a new binary. When a push also uploads a new binary,
# notes are posted after the upload finishes (not in parallel). Checking
# "update_notes" on a manual run posts notes only.
# One-time setup (see
# Mobile/ios-wrapper/README.md "TestFlight builds from CI"):
#   - Apple Developer Program membership
#   - App record for com.deadmanshand.app in App Store Connect
#   - Repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID,
#     ASC_KEY_P8_BASE64, and optionally DIST_CERT_P12_BASE64 +
#     DIST_CERT_PASSWORD (omit them and a distribution certificate is
#     minted via the App Store Connect API — no Mac needed)

on:
  workflow_dispatch:
    inputs:
      update_notes:
        description: Post tools/appstore/what-to-test.txt on the latest build instead of uploading
        type: boolean
        default: false
  # Auto-build whenever the iOS wrapper (or this pipeline) changes on main.
  push:
    branches: [main]
    paths:
      - 'Web/CinematicPoker.Web/**'
      - 'Mobile/ios-wrapper/**'
      - '.github/workflows/ios-testflight.yml'
      - 'tools/appstore/what-to-test.txt'
      - 'tools/appstore/testflight_notes.py'

jobs:
  detect:
    name: Decide notes or upload
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.d.outputs.notes }}
      app: ${{ steps.d.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "notes=false" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "notes=false" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$before" "${{ github.sha }}")
          printf '%s\n' "$files"
          notes=false
          app=false
          printf '%s\n' "$files" | grep -Eq '^(tools/appstore/what-to-test.txt|tools/appstore/testflight_notes.py)$' && notes=true || true
          printf '%s\n' "$files" | grep -Eq '^(Web/CinematicPoker.Web/|Mobile/ios-wrapper/)' && app=true || true
          if [ "$notes" != true ] && printf '%s\n' "$files" | grep -qx '.github/workflows/ios-testflight.yml'; then
            app=true
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  update-what-to-test:
    name: Post What to Test notes
    needs: detect
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.update_notes == true) ||
      (github.event_name == 'push' && needs.detect.outputs.notes == 'true' && needs.detect.outputs.app != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install App Store Connect client
        run: pip install PyJWT cryptography

      - name: Post What to Test on the latest build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: python tools/appstore/testflight_notes.py

  build-and-upload:
    name: Build, sign and upload to TestFlight
    needs: detect
    if: >-
      (github.event_name == 'push' && needs.detect.outputs.app == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.update_notes != true)
    # macos-26 defaults to Xcode 26.x. Apple rejects uploads built with
    # anything older than the iOS 26 SDK (macos-15 defaults to Xcode 16.4).
    runs-on: macos-26
    defaults:
      run:
        working-directory: Mobile/ios-wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor CLI
        run: npm ci

      - name: Publish Blazor app and stage web bundle
        run: ./scripts/build-www.sh

      - name: Sync web bundle into the iOS project
        run: npx cap sync ios

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: fastlane ios beta

      # Backup copy only — the .ipa has already been uploaded to TestFlight
      # by the previous step, so a failure here (e.g. artifact storage quota)
      # must not mark the run as failed.
      - name: Upload .ipa as workflow artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CinematicPoker-iOS
          path: Mobile/ios-wrapper/build/*.ipa
          if-no-files-found: ignore

  post-notes-after-upload:
    name: Post What to Test after upload
    needs: [detect, build-and-upload]
    if: >-
      always() &&
      needs.build-and-upload.result == 'success' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.app == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.update_notes != true)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install App Store Connect client
        run: pip install PyJWT cryptography

      - name: Post What to Test on this CI build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MIN_BUILD: ${{ github.run_number }}
        run: python tools/appstore/testflight_notes.py
