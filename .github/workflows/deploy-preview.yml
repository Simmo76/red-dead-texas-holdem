name: Deploy Branch Preview to GitHub Pages

# Publishes a testable preview of a work-in-progress branch WITHOUT touching
# the live game: the site root is rebuilt from main exactly as deploy-web.yml
# would, and the branch build is added under /preview/<branch-slug>/.
#
# Pages serves a single deployment, so every deploy re-assembles all live
# previews (tools/collect-previews.sh). Each branch build is kept as a
# "preview-<slug>" artifact for 14 days; a preview disappears when it expires
# or its branch is deleted, not when another branch or main deploys.
#
# NOTE: the github-pages environment must allow deployments from these
# branches (Settings -> Environments -> github-pages -> deployment branches).

on:
  push:
    branches: ['cursor/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    # Not in the "pages" concurrency group: a queued deploy can be cancelled
    # by a newer one, but this branch's build must still be saved so the
    # newer deploy picks it up.
    name: Test engine and build branch preview
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run engine tests on preview branch
        run: dotnet test DotNet/CinematicPoker.Engine.Tests/CinematicPoker.Engine.Tests.csproj --nologo

      - name: Publish preview from branch
        run: dotnet publish Web/CinematicPoker.Web/CinematicPoker.Web.csproj -c Release -o publish-preview

      - name: Prepare preview
        id: slug
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          echo "slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/preview/${BRANCH_SLUG}/\" />|" publish-preview/wwwroot/index.html
          printf '{"version":"%s","built":"%s","preview":"%s","branch":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BRANCH_SLUG" "$GITHUB_REF_NAME" \
            > publish-preview/wwwroot/version.json

      - name: Save preview build
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.slug.outputs.slug }}
          path: publish-preview/wwwroot
          retention-days: 14

  deploy:
    name: Assemble site and deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Shares the group with deploy-web.yml: one Pages deployment at a time.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out preview branch (tools)
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Check out main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish live site from main
        run: dotnet publish main-src/Web/CinematicPoker.Web/CinematicPoker.Web.csproj -c Release -o publish-main

      - name: Assemble live site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p site
          cp -r publish-main/wwwroot/. site/
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|" site/index.html
          MAIN_SHA="$(git -C main-src rev-parse HEAD)"
          printf '{"version":"%s","built":"%s"}\n' "$MAIN_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/version.json
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Add other branch previews
        run: preview-src/tools/collect-previews.sh site "${{ needs.build.outputs.slug }}"

      - name: Add this branch's preview
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ needs.build.outputs.slug }}
          path: site/preview/${{ needs.build.outputs.slug }}

      - name: Summary
        run: |
          echo "Preview will be served at: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/preview/${{ needs.build.outputs.slug }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Previews on the site:" >> "$GITHUB_STEP_SUMMARY"
          ls site/preview | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview link to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- branch-preview-url -->';
            const slug = context.ref.replace('refs/heads/', '').replaceAll('/', '-');
            const previewUrl = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/preview/${slug}/`;
            const body = `${marker}\nPreview: [Open the branch build](${previewUrl})`;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const pr = prs.find((item) => item.state === 'open');
            if (!pr) {
              core.info('No open pull request is associated with this commit.');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
