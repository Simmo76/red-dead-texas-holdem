name: Deploy Branch Preview to GitHub Pages

# Publishes a testable preview of a work-in-progress branch WITHOUT touching
# the live game: the site root is rebuilt from main exactly as deploy-web.yml
# would, and the branch build is added under /preview/<branch-slug>/.
# The preview disappears automatically the next time main deploys.
#
# NOTE: the github-pages environment must allow deployments from these
# branches (Settings -> Environments -> github-pages -> deployment branches).

on:
  push:
    branches: ['cursor/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# Shares the group with deploy-web.yml: one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test engine and build preview + production site
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Check out main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run engine tests on preview branch
        run: dotnet test preview-src/DotNet/CinematicPoker.Engine.Tests/CinematicPoker.Engine.Tests.csproj --nologo

      - name: Publish live site from main
        run: dotnet publish main-src/Web/CinematicPoker.Web/CinematicPoker.Web.csproj -c Release -o publish-main

      - name: Publish preview from branch
        run: dotnet publish preview-src/Web/CinematicPoker.Web/CinematicPoker.Web.csproj -c Release -o publish-preview

      - name: Assemble combined site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"

          mkdir -p site
          cp -r publish-main/wwwroot/. site/
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|" site/index.html
          printf '{"version":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/version.json
          cp site/index.html site/404.html

          mkdir -p "site/preview/${BRANCH_SLUG}"
          cp -r publish-preview/wwwroot/. "site/preview/${BRANCH_SLUG}/"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/preview/${BRANCH_SLUG}/\" />|" "site/preview/${BRANCH_SLUG}/index.html"
          printf '{"version":"%s","built":"%s","preview":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BRANCH_SLUG" \
            > "site/preview/${BRANCH_SLUG}/version.json"

          touch site/.nojekyll
          echo "Preview will be served at: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${REPO_NAME}/preview/${BRANCH_SLUG}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview link to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- branch-preview-url -->';
            const slug = context.ref.replace('refs/heads/', '').replaceAll('/', '-');
            const previewUrl = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/preview/${slug}/`;
            const body = `${marker}\nPreview: [Open the branch build](${previewUrl})`;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            const pr = prs.find((item) => item.state === 'open');
            if (!pr) {
              core.info('No open pull request is associated with this commit.');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
