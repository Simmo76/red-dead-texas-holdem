name: Deploy Web Version to GitHub Pages

# Publishes only after Regression tests succeed on a main-branch push. Manual
# runs still execute the harness in the build job first.
on:
  workflow_run:
    workflows: [Regression tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run regression harness
        if: github.event_name == 'workflow_dispatch'
        run: bash tools/run-harness.sh

      - name: Publish Blazor WebAssembly app
        run: dotnet publish Web/CinematicPoker.Web/CinematicPoker.Web.csproj -c Release -o publish

      - name: Rewrite base href for project pages
        # The app is served from https://<user>.github.io/<repo>/, not the domain root.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/${REPO_NAME}/\" />|" publish/wwwroot/index.html
          # Pages serves files verbatim; precompressed publish output is dead weight.
          find publish/wwwroot \( -name '*.br' -o -name '*.gz' \) -delete
          # Desktop shortcuts cache index.html for days; version.json is
          # fetched with cache: 'no-store' so a new SHA forces one reload.
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          printf '{"version":"%s","built":"%s"}\n' "$DEPLOY_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > publish/wwwroot/version.json
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Publish topbar layout preview
        run: tools/copy-topbar-preview.sh publish/wwwroot

      - name: Keep branch previews
        # Pages serves one deployment; re-add the live /preview/<slug>/ builds
        # so a main deploy doesn't wipe them (see deploy-preview.yml).
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/collect-previews.sh publish/wwwroot

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
