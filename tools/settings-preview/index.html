<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Toolbar preview — Dead Man's Hand</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    html, body { background: #1a100c; }
    .preview-note {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      max-width: 360px;
      padding: 10px 14px;
      border: 1px solid rgba(216, 178, 92, 0.45);
      border-radius: 10px;
      background: rgba(8, 5, 3, 0.88);
      color: #e8e4d8;
      font: 13px/1.4 Georgia, "Times New Roman", serif;
    }
    .preview-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .phone-frame {
      position: relative;
      width: min(844px, 100%);
      height: min(390px, 100%);
      overflow: hidden;
      border: 1px solid rgba(216, 178, 92, 0.35);
      border-radius: 12px;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(80, 50, 30, 0.55), transparent 60%),
        #0e0906;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <div class="preview-stage">
    <div class="phone-frame game3d" aria-label="iPhone landscape layout preview">
      <header class="topbar gameplay-toolbar" role="toolbar" aria-label="Game controls">
        <div class="topbar-left toolbar-brand">
          <img class="toolbar-logo" src="img/toolbar-logo-h44.png" width="130" height="44" alt="Dead Man's Hand" />
          <div class="hud-pot">POT&nbsp;<b>$15</b></div>
        </div>
        <div class="topbar-right toolbar-controls">
          <div class="topbar-actions toolbar-actions">
            <button type="button" class="toolbar-btn toolbar-pill toolbar-primary" aria-label="Rules">
              <img class="toolbar-pill-img" src="icons/toolbar/pills/rules.png" srcset="icons/toolbar/pills/rules@2x.png 2x" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="toolbar-btn toolbar-pill toolbar-primary toolbar-item-tune" aria-label="Tune">
              <img class="toolbar-pill-img" src="icons/toolbar/pills/tune.png" srcset="icons/toolbar/pills/tune@2x.png 2x" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="toolbar-btn toolbar-pill toolbar-primary" aria-label="Hands">
              <img class="toolbar-pill-img" src="icons/toolbar/pills/hands.png" srcset="icons/toolbar/pills/hands@2x.png 2x" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="toolbar-btn toolbar-pill toolbar-primary toolbar-item-view" aria-label="View">
              <img class="toolbar-pill-img" src="icons/toolbar/pills/view.png" srcset="icons/toolbar/pills/view@2x.png 2x" alt="" aria-hidden="true" />
            </button>
            <button type="button" class="toolbar-btn toolbar-pill toolbar-primary toolbar-item-settings" aria-label="Settings">
              <img class="toolbar-pill-img" src="icons/toolbar/pills/settings.png" srcset="icons/toolbar/pills/settings@2x.png 2x" alt="" aria-hidden="true" />
            </button>
          </div>
        </div>
      </header>

      <div class="hud-hand-rail">
        <div class="hud-board">
          <div class="hud-row hud-card-cue-row">
            <img class="hud-card facedown" src="img/cards/back.png" alt="" />
            <img class="hud-card facedown" src="img/cards/back.png" alt="" />
            <img class="hud-card facedown" src="img/cards/back.png" alt="" />
            <img class="hud-card" src="img/cards/clubs_6.png" alt="" />
            <img class="hud-card" src="img/cards/hearts_7.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="preview-note">
    <strong>Toolbar redesign</strong> — compact landscape (DMH, icon + caption).
    Acceptance harness for IMPLEMENTATION.md. Full game ships via branch preview on GitHub Pages.
  </p>
</body>
</html>
